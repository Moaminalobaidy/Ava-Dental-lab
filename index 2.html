<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#243b32"><meta name="description" content="AVA Dental Lab Management">
  <link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
  <title>AVA Dental Lab</title>
</head>
<body>
<section id="loginScreen" dir="rtl" style="min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f5f1;font-family:Tahoma,sans-serif">
 <form id="loginForm" style="width:min(420px,100%);background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #243b3218">
  <div style="font-size:26px;font-weight:bold;color:#243b32;margin-bottom:8px">AVA Dental Lab</div><p style="color:#778179;margin-bottom:22px">تسجيل دخول المدير</p>
  <label style="display:block;margin:12px 0 6px">البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="username" required style="width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box">
  <label style="display:block;margin:12px 0 6px">كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" required style="width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box">
  <button id="loginButton" style="width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#243b32;color:white;font-size:15px">دخول</button><p id="loginError" role="alert" style="color:#b65c52;font-size:13px"></p>
 </form>
</section>
<div class="app-shell" id="appShell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">AVA</div><div><b>AVA Dental Lab</b><small>نظام إدارة المختبر</small></div></div>
    <div class="nav-caption">القائمة الرئيسية</div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard"><span>▦</span> لوحة التحكم</button>
      <button class="nav-item" data-page="doctors"><span>♙</span> الأطباء</button>
      <button class="nav-item" data-page="orders"><span>▤</span> الطلبات والأعمال</button>
      <button class="nav-item finance-only" data-page="accounts"><span>◫</span> حسابات الأطباء</button>
      <button class="nav-item finance-only" data-page="cashbox"><span>▣</span> الصندوق والمصروفات</button>
      <button class="nav-item" data-page="inventory"><span>▧</span> المخزون</button>
      <button class="nav-item finance-only" data-page="reports"><span>▥</span> التقارير</button>
      <button class="nav-item manager-only" data-page="employees"><span>♧</span> الموظفون والصلاحيات</button>
      <button class="nav-item manager-only" data-page="settings"><span>⚙</span> الإعدادات</button>
    </nav>
    <div class="sidebar-bottom"><span class="status-dot"></span> وضع النموذج الأولي <small>قاعدة محلية تجريبية</small></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button><div><div class="eyebrow">AVA DENTAL LAB</div><h1 id="pageTitle">لوحة التحكم</h1></div><div class="top-actions"><button id="logoutBtn" class="btn secondary" type="button">تسجيل خروج</button><div class="avatar" title="المدير">A</div><div class="avatar">A</div></div></header>
    <section id="pageContent" class="content"></section>
    <footer>AVA Dental Lab · إصدار تجريبي أولي · لا تستخدمه لحفظ حسابات حقيقية قبل ربط قاعدة البيانات السحابية</footer>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" class="icon-btn">✕</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const AVA_SUPABASE_URL="https://xrouzulnnevlydajyppn.supabase.co";
const AVA_SUPABASE_PUBLISHABLE_KEY="sb_publishable_1GzxmiiaT79_Zq1dvF6svQ_h_nUk8-H";
const avaSupabase=window.supabase.createClient(AVA_SUPABASE_URL,AVA_SUPABASE_PUBLISHABLE_KEY);
const loginScreen=document.getElementById("loginScreen"), appShell=document.getElementById("appShell");
function showApp(){loginScreen.hidden=true;appShell.hidden=false; if(!window.avaStarted){window.avaStarted=true; startAVA();}}
function showLogin(){appShell.hidden=true;loginScreen.hidden=false;}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("loginButton"),err=document.getElementById("loginError");b.disabled=true;b.textContent="جارٍ الدخول...";err.textContent="";const {error}=await avaSupabase.auth.signInWithPassword({email:document.getElementById("loginEmail").value.trim(),password:document.getElementById("loginPassword").value});if(error)err.textContent="تعذر تسجيل الدخول. تأكد من البريد وكلمة المرور.";else showApp();b.disabled=false;b.textContent="دخول";});
document.getElementById("logoutBtn").addEventListener("click",async()=>{await avaSupabase.auth.signOut();showLogin();});
avaSupabase.auth.getSession().then(({data})=>{if(data.session)showApp();else showLogin();});
</script>
<style>#appShell[hidden],#loginScreen[hidden]{display:none!important}</style>
<script>
const $=s=>document.querySelector(s);const state={page:'dashboard',role:'owner',doctors:[],orders:[],payments:[],expenses:[],inventory:[],employees:[]};
const money=n=>new Intl.NumberFormat('en-US').format(Number(n||0))+' د.ع';const today=()=>new Date().toLocaleDateString('en-GB');
function load(){try{const x=JSON.parse(localStorage.getItem('ava-demo')||'{}');Object.assign(state,x)}catch(e){}}
function save(){localStorage.setItem('ava-demo',JSON.stringify({doctors:state.doctors,orders:state.orders,payments:state.payments,expenses:state.expenses,inventory:state.inventory,employees:state.employees}))}
const pages={dashboard:'لوحة التحكم',doctors:'إدارة الأطباء',orders:'الطلبات والأعمال',accounts:'حسابات الأطباء',cashbox:'الصندوق والمصروفات',inventory:'المخزون',reports:'التقارير',employees:'الموظفون والصلاحيات',settings:'الإعدادات'};
function roleUI(){document.querySelectorAll('.finance-only,.manager-only').forEach(x=>x.classList.remove('hidden'));document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));$('#pageTitle').textContent=pages[state.page];render()}
function go(p){state.page=p;roleUI();$('#sidebar').classList.remove('open')}
function button(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function dashboard(){const debt=state.orders.reduce((s,o)=>s+Number(o.price||0),0)-state.payments.reduce((s,p)=>s+Number(p.amount||0),0);const collected=state.payments.reduce((s,p)=>s+Number(p.amount||0),0);const cards=[['عدد الأطباء',state.doctors.length,'♙'],['الطلبات المسجلة',state.orders.length,'▤'],['الأعمال قيد التنفيذ',state.orders.filter(o=>o.status!=='تم التسليم').length,'◷'],['إجمالي الديون',state.role==='technician'?'—':money(Math.max(0,debt)),'◫']];return `<div class="welcome"><div><h2>مرحباً بك في AVA Dental Lab</h2><p>إدارة أعمال المختبر وحسابات الأطباء من مكان واحد</p></div><div class="date">اليوم · ${today()}</div></div><div class="stats">${cards.map((c,i)=>`<div class="stat"><div class="stat-head"><span>${c[0]}</span><span class="stat-icon">${c[2]}</span></div><strong>${c[1]}</strong><small>${i===3?'يتحدث حسب الدفعات المسجلة':'ملخص النظام'}</small></div>`).join('')}</div><div class="grid-2"><div class="panel"><div class="panel-head"><h3>آخر الطلبات</h3>${button('عرض الكل','orders','btn secondary')}</div>${state.orders.length?tableOrders(state.orders.slice(-5).reverse()):empty('لا توجد طلبات مسجلة بعد')}</div><div class="panel"><div class="panel-head"><h3>اختصارات سريعة</h3></div><div class="quick-grid"><button class="quick-card" data-action="add-doctor"><span>♙</span><b>إضافة طبيب</b></button><button class="quick-card" data-action="add-order"><span>▤</span><b>طلب جديد</b></button>${state.role!=='technician'?`<button class="quick-card" data-action="add-payment"><span>◫</span><b>تسجيل دفعة</b></button><button class="quick-card" data-action="add-expense"><span>▣</span><b>مصروف جديد</b></button>`:''}</div><div class="notice" style="margin-top:15px">ملاحظة: هذه نسخة تجريبية تحفظ البيانات على نفس المتصفح فقط. المزامنة السحابية تُفعّل بعد إعداد مشروع قاعدة البيانات.</div></div></div>`}
function empty(t){return `<div class="empty"><div class="empty-icon">⌁</div>${t}</div>`}
function tableOrders(rows){return `<div class="table-wrap"><table><thead><tr><th>رقم</th><th>الطبيب</th><th>المريض</th><th>نوع العمل</th><th>الحالة</th>${state.role!=='technician'?'<th>السعر</th>':''}</tr></thead><tbody>${rows.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.doctor)}</td><td>${esc(o.patient)}</td><td>${esc(o.kind)}</td><td><span class="pill ${o.status==='تم التسليم'?'':'warn'}">${esc(o.status)}</span></td>${state.role!=='technician'?`<td>${money(o.price)}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function doctors(){return `<div class="toolbar"><div><h2>الأطباء والعيادات</h2><p>إدارة بيانات الأطباء المرتبطين بالمختبر</p></div>${button('+ إضافة طبيب','add-doctor')}</div><div class="panel">${state.doctors.length?`<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>العيادة</th><th>ملاحظات</th><th></th></tr></thead><tbody>${state.doctors.map((d,i)=>`<tr><td>${esc(d.name)}</td><td>${esc(d.phone||'—')}</td><td>${esc(d.clinic||'—')}</td><td>${esc(d.notes||'—')}</td><td>${button('حذف','del-doctor-'+i,'btn danger')}</td></tr>`).join('')}</tbody></table></div>`:empty('لم تتم إضافة أطباء بعد')}</div>`}
function orders(){return `<div class="toolbar"><div><h2>الطلبات والأعمال السنية</h2><p>متابعة الحالات من الاستلام إلى التسليم</p></div>${button('+ تسجيل طلب','add-order')}</div><div class="panel">${state.orders.length?tableOrders([...state.orders].reverse()):empty('لا توجد طلبات حالياً')}</div>`}
function accounts(){const totals=state.doctors.map(d=>{const sum=state.orders.filter(o=>o.doctor===d.name).reduce((s,o)=>s+ +o.price,0);const paid=state.payments.filter(p=>p.doctor===d.name).reduce((s,p)=>s+ +p.amount,0);return {...d,sum,paid,balance:sum-paid}});return `<div class="toolbar"><div><h2>حسابات الأطباء</h2><p>الأرصدة والدفعات والمبالغ المتبقية</p></div>${button('+ تسجيل دفعة','add-payment')}</div><div class="panel">${totals.length?`<div class="table-wrap"><table><thead><tr><th>الطبيب</th><th>إجمالي الأعمال</th><th>المدفوع</th><th>الرصيد</th><th></th></tr></thead><tbody>${totals.map(d=>`<tr><td>${esc(d.name)}</td><td>${money(d.sum)}</td><td>${money(d.paid)}</td><td><b>${money(d.balance)}</b></td><td>${button('كشف','statement-'+encodeURIComponent(d.name),'btn secondary')}</td></tr>`).join('')}</tbody></table></div>`:empty('أضف طبيباً وطلبات حتى تظهر الحسابات')}</div>`}
function cashbox(){const income=state.payments.reduce((s,p)=>s+ +p.amount,0),out=state.expenses.reduce((s,e)=>s+ +e.amount,0);return `<div class="toolbar"><div><h2>الصندوق والمصروفات</h2><p>متابعة المقبوضات والمصروفات المسجلة</p></div><div>${button('+ تسجيل دفعة','add-payment')} ${button('+ مصروف','add-expense','btn secondary')}</div></div><div class="stats"><div class="stat"><div class="stat-head">إجمالي المقبوضات</div><strong>${money(income)}</strong></div><div class="stat"><div class="stat-head">إجمالي المصروفات</div><strong>${money(out)}</strong></div><div class="stat"><div class="stat-head">صافي الحركة</div><strong>${money(income-out)}</strong></div><div class="stat"><div class="stat-head">عدد الحركات</div><strong>${state.payments.length+state.expenses.length}</strong></div></div><div class="panel"><h3>آخر المصروفات</h3>${state.expenses.length?`<table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>${[...state.expenses].reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.title)}</td><td>${money(e.amount)}</td></tr>`).join('')}</tbody></table>`:empty('لا توجد مصروفات')}</div>`}
function inventory(){return `<div class="toolbar"><div><h2>المخزون</h2><p>متابعة المواد والكميات المتوفرة</p></div>${button('+ إضافة مادة','add-stock')}</div><div class="panel">${state.inventory.length?`<table><thead><tr><th>المادة</th><th>الكمية</th><th>وحدة القياس</th><th>ملاحظات</th></tr></thead><tbody>${state.inventory.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.qty)}</td><td>${esc(x.unit)}</td><td>${esc(x.notes||'—')}</td></tr>`).join('')}</tbody></table>`:empty('المخزون فارغ حالياً')}</div>`}
function reports(){const income=state.payments.reduce((s,p)=>s+ +p.amount,0),expense=state.expenses.reduce((s,e)=>s+ +e.amount,0),sales=state.orders.reduce((s,o)=>s+ +o.price,0);return `<div class="toolbar"><div><h2>التقارير</h2><p>ملخص الأرقام المسجلة في النموذج</p></div></div><div class="stats"><div class="stat"><div class="stat-head">قيمة الأعمال</div><strong>${money(sales)}</strong></div><div class="stat"><div class="stat-head">المقبوضات</div><strong>${money(income)}</strong></div><div class="stat"><div class="stat-head">المصروفات</div><strong>${money(expense)}</strong></div><div class="stat"><div class="stat-head">صافي المقبوضات بعد المصروفات</div><strong>${money(income-expense)}</strong></div></div><div class="notice warning">هذا ملخص نقدي مبسط وليس قائمة أرباح وخسائر محاسبية معتمدة. يلزم ربط كل التكاليف المباشرة وغير المباشرة قبل احتساب الربح الحقيقي.</div>`}
function employees(){return `<div class="toolbar"><div><h2>الموظفون والصلاحيات</h2><p>إدارة المستخدمين ومستويات الوصول</p></div>${button('+ إضافة موظف','add-employee')}</div><div class="panel"><div class="notice">الموظف الفني لا يمكنه مشاهدة أي شاشة مالية. الصلاحيات الفعلية ستُفرض من قاعدة البيانات السحابية، وليس من إخفاء الواجهة فقط.</div>${state.employees.length?`<table><thead><tr><th>الاسم</th><th>اسم الدخول</th><th>الدور</th></tr></thead><tbody>${state.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.login)}</td><td>${e.role==='technician'?'موظف فني':'محاسب'}</td></tr>`).join('')}</tbody></table>`:empty('لم تتم إضافة موظفين')}</div>`}
function settings(){return `<div class="panel"><h3>إعدادات AVA Dental Lab</h3><div class="summary-row"><span>العملة</span><b>الدينار العراقي (IQD)</b></div><div class="summary-row"><span>اللغة</span><b>العربية</b></div><div class="summary-row"><span>اتجاه الواجهة</span><b>من اليمين إلى اليسار</b></div><div class="summary-row"><span>دور الموظف الفني</span><b>بدون صلاحيات مالية</b></div><div class="summary-row"><span>المزامنة</span><b>بانتظار ربط Supabase</b></div><div class="notice warning" style="margin-top:15px">لا توجد مزامنة بين الأجهزة في هذه النسخة. لا تضع بيانات مرضى أو حسابات حقيقية قبل إعداد الاستضافة وقاعدة البيانات وتفعيل سياسات الحماية.</div></div>`}
function render(){const f={dashboard,doctors,orders,accounts,cashbox,inventory,reports,employees,settings};$('#pageContent').innerHTML=f[state.page]();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalBackdrop').hidden=false}function close(){ $('#modalBackdrop').hidden=true }
function formField(label,name,placeholder='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${extra} required></div>`}
function openForm(type){let html='',title='';if(type==='doctor'){title='إضافة طبيب';html=`<form id="dataForm"><div class="form-grid">${formField('اسم الطبيب','name','الاسم الكامل')}${formField('رقم الهاتف','phone','07xxxxxxxxx','tel')}${formField('اسم العيادة','clinic','اسم العيادة')}<div class="field"><label>ملاحظات</label><input name="notes" placeholder="اختياري"></div></div><div class="form-actions"><button class="btn">حفظ الطبيب</button></div></form>`}if(type==='order'){title='تسجيل طلب جديد';html=`<form id="dataForm"><div class="form-grid">${formField('اسم المريض','patient','اسم المريض')}<div class="field"><label>الطبيب</label><select name="doctor" required>${state.doctors.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label>نوع العمل</label><select name="kind"><option>Zirconia Full Anatomy</option><option>Zirconia Layering</option><option>E.max</option><option>Implant</option><option>Removable</option><option>I-Bar Titanium</option></select></div>${formField('عدد الأسنان','teeth','مثلاً 3','number','min="1" value="1"')}${formField('اللون Shade','shade','مثلاً 3M1')} ${state.role!=='technician'?formField('السعر بالدينار','price','المبلغ','number','min="0"'):''}<div class="field"><label>حالة الطلب</label><select name="status"><option>جديد</option><option>قيد العمل</option><option>مكتمل</option><option>تم التسليم</option></select></div><div class="field"><label>موعد التسليم</label><input name="due" type="date"></div></div><div class="form-actions"><button class="btn">حفظ الطلب</button></div></form>`}if(type==='payment'){title='تسجيل دفعة';html=`<form id="dataForm"><div class="form-grid"><div class="field"><label>الطبيب</label><select name="doctor" required>${state.doctors.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select></div>${formField('المبلغ بالدينار','amount','المبلغ','number','min="1"')}${formField('طريقة الدفع','method','نقداً / تحويل')}${formField('ملاحظة','note','اختياري')}</div><div class="form-actions"><button class="btn">حفظ الدفعة</button></div></form>`}if(type==='expense'){title='تسجيل مصروف';html=`<form id="dataForm"><div class="form-grid">${formField('بيان المصروف','title','مثلاً مواد')}${formField('المبلغ بالدينار','amount','المبلغ','number','min="1"')}${formField('التاريخ','date',today(),'date')}${formField('ملاحظات','note','اختياري')}</div><div class="form-actions"><button class="btn">حفظ المصروف</button></div></form>`}if(type==='stock'){title='إضافة مادة للمخزون';html=`<form id="dataForm"><div class="form-grid">${formField('اسم المادة','name','اسم المادة')}${formField('الكمية','qty','الكمية','number','min="0"')}${formField('وحدة القياس','unit','قطعة / علبة / غرام')}${formField('ملاحظات','notes','اختياري')}</div><div class="form-actions"><button class="btn">حفظ المادة</button></div></form>`}if(type==='employee'){title='إضافة موظف';html=`<form id="dataForm"><div class="form-grid">${formField('اسم الموظف','name','الاسم')}${formField('اسم الدخول','login','username')}<div class="field"><label>الدور</label><select name="role"><option value="technician">موظف فني (بدون معلومات مالية)</option><option value="accountant">محاسب</option></select></div></div><div class="notice warning">إضافة الحسابات وتعيين كلمات المرور تتم عند تفعيل تسجيل الدخول السحابي.</div><div class="form-actions"><button class="btn">حفظ بيانات الموظف</button></div></form>`}modal(title,html);$('#dataForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(type==='doctor')state.doctors.push(d);if(type==='order'){d.id=state.orders.length+1;d.created=today();if(state.role==='technician')d.price=0;state.orders.push(d)}if(type==='payment'){d.date=today();state.payments.push(d)}if(type==='expense')state.expenses.push(d);if(type==='stock')state.inventory.push(d);if(type==='employee')state.employees.push(d);save();close();render();toast('تم الحفظ في النموذج التجريبي')})}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2300)}
function action(a){if(a.startsWith('del-doctor-')){state.doctors.splice(+a.split('-').pop(),1);save();render();toast('تم حذف الطبيب');return}if(a.startsWith('statement-')){const n=decodeURIComponent(a.slice(10)),orders=state.orders.filter(o=>o.doctor===n),pays=state.payments.filter(p=>p.doctor===n),sum=orders.reduce((s,o)=>s+ +o.price,0),paid=pays.reduce((s,p)=>s+ +p.amount,0);modal('كشف حساب '+n,`<div class="summary-row"><span>إجمالي الأعمال</span><b>${money(sum)}</b></div><div class="summary-row"><span>المدفوع</span><b>${money(paid)}</b></div><div class="summary-row"><span>المتبقي</span><b>${money(sum-paid)}</b></div>`);return}const map={'add-doctor':'doctor','add-order':'order','add-payment':'payment','add-expense':'expense','add-stock':'stock','add-employee':'employee'};if(map[a]){if(state.role==='technician'&&['payment','expense'].includes(map[a]))return;openForm(map[a]);return}if(pages[a])go(a)}

// AVA v0.2: tooth-level production costs and doctor invoice filtering
function toothRow(index){return `<div class="tooth-cost-row" data-tooth-row="${index}" style="display:grid;grid-template-columns:1.1fr repeat(4,1fr);gap:8px;margin:10px 0;padding:12px;border:1px solid var(--line,#ddd);border-radius:12px"><div class="field"><label>اسم / رقم السن</label><input name="tooth_name_${index}" placeholder="مثلاً 11" required></div>${state.role!=='technician'?`<div class="field"><label>Milling</label><input name="milling_${index}" type="number" min="0" value="0"></div><div class="field"><label>Design</label><input name="design_${index}" type="number" min="0" value="0"></div><div class="field"><label>Buildup</label><input name="buildup_${index}" type="number" min="0" value="0"></div><div class="field"><label>Glaze</label><input name="glaze_${index}" type="number" min="0" value="0"></div>`:`<div class="field"><label>التكلفة</label><input disabled placeholder="للمدير فقط"></div><div></div><div></div><div></div>`}</div>`}
function openToothOrderForm(){
 if(!state.doctors.length){toast('أضف طبيباً أولاً');return;}
 let toothCount=1;
 const html=`<form id="toothOrderForm"><div class="form-grid"><div class="field"><label>الطبيب</label><select name="doctor" required>${state.doctors.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select></div>${formField('اسم المريض','patient','اسم المريض')}<div class="field"><label>نوع العمل</label><select name="kind"><option>Zirconia Full Anatomy</option><option>Zirconia Layering</option><option>E.max</option><option>Implant</option><option>Removable</option><option>I-Bar Titanium</option></select></div><div class="field"><label>حالة الطلب</label><select name="status"><option>جديد</option><option>قيد العمل</option><option>مكتمل</option><option>تم التسليم</option></select></div>${formField('اللون Shade','shade','مثلاً 3M1')}${formField('قسم الحالات','case_department','مثلاً ثابتة / متحركة / زرعات')}${formField('موعد التسليم','due','','date')}<div class="field"><label>منو أخذ السكانر؟</label><input name="scanner_by" placeholder="اسم الموظف / الفني"></div></div><div class="panel" style="margin-top:14px;padding:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>تفاصيل الأسنان وتكاليفها</h3><button type="button" class="btn secondary" id="addToothRow">+ إضافة سن</button></div><div style="overflow-x:auto"><div id="toothRows">${toothRow(0)}</div></div><div class="notice" style="margin-top:10px">كل سن يُسجّل بشكل مستقل. تُجمع تكاليف Milling وDesign وBuildup وGlaze تلقائياً في إجمالي الطلب.</div><div id="toothGrandTotal" style="font-weight:700;margin-top:10px">إجمالي تكلفة الإنتاج: ${state.role==='technician'?'—':money(0)}</div></div><div class="form-actions"><button class="btn">حفظ الطلب</button></div></form>`;
 modal('طلب جديد – تفاصيل الأسنان',html);
 const rows=$('#toothRows');
 $('#addToothRow').addEventListener('click',()=>{rows.insertAdjacentHTML('beforeend',toothRow(toothCount++));});
 $('#toothOrderForm').addEventListener('input',()=>{if(state.role==='technician')return;let total=0;rows.querySelectorAll('[data-tooth-row]').forEach(r=>r.querySelectorAll('input[type=number]').forEach(i=>total+=Number(i.value||0)));$('#toothGrandTotal').textContent='إجمالي تكلفة الإنتاج: '+money(total);});
 $('#toothOrderForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),d=Object.fromEntries(fd);const teeth=[];rows.querySelectorAll('[data-tooth-row]').forEach((r,i)=>{const get=n=>Number(fd.get(`${n}_${i}`)||0);teeth.push({name:fd.get(`tooth_name_${i}`),milling:get('milling'),design:get('design'),buildup:get('buildup'),glaze:get('glaze')});});const total=teeth.reduce((s,t)=>s+t.milling+t.design+t.buildup+t.glaze,0);state.orders.push({id:state.orders.length+1,created:today(),doctor:d.doctor,patient:d.patient,kind:d.kind,status:d.status,shade:d.shade,case_department:d.case_department,due:d.due,scanner_by:d.scanner_by,teeth,price:total});save();close();render();toast('تم حفظ الطلب وتفاصيل الأسنان');});
}
function orders(){const selected=window.avaDoctorFilter||'';const rows=[...state.orders].filter(o=>!selected||o.doctor===selected).reverse();return `<div class="toolbar"><div><h2>الطلبات وفواتير الأطباء</h2><p>فلترة الطلبات والفواتير حسب الطبيب</p></div>${button('+ تسجيل طلب','add-order')}</div><div class="panel"><div class="field" style="max-width:360px;margin-bottom:15px"><label>اختر الطبيب لعرض فواتيره</label><select id="avaDoctorFilter"><option value="">كل الأطباء</option>${state.doctors.map(d=>`<option value="${esc(d.name)}" ${selected===d.name?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>رقم</th><th>الطبيب</th><th>المريض</th><th>الأسنان</th><th>نوع العمل</th><th>قسم الحالات</th><th>السكانر أخذه</th><th>الحالة</th>${state.role!=='technician'?'<th>تكلفة الإنتاج</th>':''}<th>التفاصيل</th></tr></thead><tbody>${rows.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.doctor)}</td><td>${esc(o.patient)}</td><td>${(o.teeth||[]).map(t=>esc(t.name)).join('، ')||esc(o.teeth||'—')}</td><td>${esc(o.kind)}</td><td>${esc(o.case_department||'—')}</td><td>${esc(o.scanner_by||'—')}</td><td>${esc(o.status)}</td>${state.role!=='technician'?`<td>${money(o.price)}</td>`:''}<td>${button('عرض','tooth-detail-'+o.id,'btn secondary')}</td></tr>`).join('')}</tbody></table></div>`:empty(selected?'لا توجد فواتير لهذا الطبيب':'لا توجد طلبات حالياً')}</div>`}
const avaBaseAction=action;
function action(a){if(a==='add-order'){openToothOrderForm();return;}if(a.startsWith('tooth-detail-')){const o=state.orders.find(x=>x.id===Number(a.split('-').pop()));if(!o)return;const rows=(o.teeth||[]).map(t=>`<tr><td>${esc(t.name)}</td>${state.role!=='technician'?`<td>${money(t.milling)}</td><td>${money(t.design)}</td><td>${money(t.buildup)}</td><td>${money(t.glaze)}</td><td>${money(t.milling+t.design+t.buildup+t.glaze)}</td>`:''}</tr>`).join('');modal('تفاصيل الطلب #'+o.id,`<p><b>الطبيب:</b> ${esc(o.doctor)} &nbsp; <b>المريض:</b> ${esc(o.patient)}</p><p><b>قسم الحالات:</b> ${esc(o.case_department||'—')}</p><p><b>من أخذ السكانر:</b> ${esc(o.scanner_by||'—')}</p><div class="table-wrap"><table><thead><tr><th>السن</th>${state.role!=='technician'?'<th>Milling</th><th>Design</th><th>Buildup</th><th>Glaze</th><th>المجموع</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>${state.role!=='technician'?`<div class="summary-row"><b>إجمالي تكلفة الإنتاج</b><b>${money(o.price)}</b></div>`:''}`);return;}avaBaseAction(a)}

$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('#pageContent').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b.dataset.action)});$('#pageContent').addEventListener('change',e=>{if(e.target.id==='avaDoctorFilter'){window.avaDoctorFilter=e.target.value;render()}});$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#closeModal').addEventListener('click',close);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')close()});function startAVA(){state.role='owner';load();roleUI();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

</script>
