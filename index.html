const SUPABASE_URL='https://xrouzulnnevlydajyppn.supabase.co';const SUPABASE_KEY='sb_publishable_1GzxmiiaT79_Zq1dvF6svQ_h_nUk8-H';const rememberKey='ava_remember_session';let rememberPref=localStorage.getItem(rememberKey)!=='false';const makeDb=remember=>window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:remember,autoRefreshToken:true,detectSessionInUrl:true}});let db=makeDb(rememberPref);
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('en-US').format(Number(n||0))+' د.ع',today=()=>new Date().toISOString().slice(0,10);let user=null,profile=null,data={doctors:[],patients:[],orders:[],teeth:[],financials:[],payments:[],expenses:[],inventory:[]},page='dashboard';const names={dashboard:'لوحة التحكم',doctors:'إدارة الأطباء',orders:'الطلبات والحالات',accounts:'حسابات الأطباء',cashbox:'الصندوق والمصروفات',inventory:'المخزون',reports:'التقارير'};

async function refresh(){const tables=['doctors','patients','lab_orders','lab_order_teeth','order_financials','payments','expenses','inventory_items'];const keys=['doctors','patients','orders','teeth','financials','payments','expenses','inventory'];for(let i=0;i<tables.length;i++){const {data:d,error}=await db.from(tables[i]).select('*').order(i===2?'order_number':((i===4||i===7)?'updated_at':'created_at'),{ascending:false}).limit(1000);if(error){if(tables[i]==='inventory_items'){const r=await db.from(tables[i]).select('*');if(r.error)throw r.error;data[keys[i]]=r.data||[]}else throw error}else data[keys[i]]=d||[]} }
const doctorName=id=>data.doctors.find(d=>d.id===id)?.name||'—';const orderTotal=o=>{const f=data.financials.find(x=>x.order_id===o.id);return Number(f?.price_iqd||0)-Number(f?.discount_iqd||0)};
function render(){ $('#title').textContent=names[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const c=$('#content');if(page==='dashboard'){const total=data.orders.reduce((s,o)=>s+orderTotal(o),0),paid=data.payments.reduce((s,p)=>s+Number(p.amount_iqd),0),pending=data.orders.filter(o=>o.status!=='تم التسليم').length;c.innerHTML=`<div class="stats"><div class="stat"><span>الأطباء</span><strong>${data.doctors.length}</strong></div><div class="stat"><span>الطلبات</span><strong>${data.orders.length}</strong></div><div class="stat"><span>قيد التنفيذ</span><strong>${pending}</strong></div><div class="stat"><span>الرصيد المستحق</span><strong>${money(total-paid)}</strong></div></div><div class="panel"><h3>آخر الحالات</h3>${ordersTable(data.orders.slice(0,8))}</div>`}
if(page==='doctors')c.innerHTML=`<div class="toolbar"><div><h3>الأطباء والعيادات</h3><span class="muted">إدارة الأطباء: تفعيل أو تعطيل أو حذف آمن</span></div><button id="addDoctor">+ إضافة طبيب</button></div><div class="panel">${data.doctors.length?`<table><tr><th>الاسم</th><th>الهاتف</th><th>العيادة</th><th>الحالة</th><th>إجراءات</th></tr>${data.doctors.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.phone||'—')}</td><td>${esc(d.clinic||'—')}</td><td><span class="pill">${d.active===false?'معطّل':'نشط'}</span></td><td><div class="actions"><button class="secondary" data-toggle-doctor="${d.id}" data-active="${d.active===false?'false':'true'}">${d.active===false?'إعادة تفعيل':'تعطيل'}</button><button class="danger" data-delete-doctor="${d.id}">حذف</button></div></td></tr>`).join('')}</table>`:'لا توجد أسماء أطباء بعد.'}</div>`;
if(page==='orders')c.innerHTML=`<div class="toolbar"><div><h3>الطلبات والحالات</h3><span class="muted">تفاصيل الأسنان وتكاليف الإنتاج</span></div><button id="addOrder">+ تسجيل حالة</button></div><div class="panel"><div class="field" style="max-width:340px;margin-bottom:14px"><label>فلترة حسب الطبيب</label><select id="doctorFilter"><option value="">كل الأطباء</option>${data.doctors.filter(d=>d.active!==false).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div id="orderList">${ordersTable(data.orders)}</div></div>`;
if(page==='accounts'){const rows=data.doctors.map(d=>{const sum=data.orders.filter(o=>o.doctor_id===d.id).reduce((s,o)=>s+orderTotal(o),0),paid=data.payments.filter(p=>p.doctor_id===d.id).reduce((s,p)=>s+Number(p.amount_iqd),0);return `<tr><td>${esc(d.name)}</td><td>${money(sum)}</td><td>${money(paid)}</td><td><b>${money(sum-paid)}</b></td></tr>`}).join('');c.innerHTML=`<div class="toolbar"><h3>حسابات الأطباء</h3><button id="addPayment">+ تسجيل دفعة</button></div><div class="panel"><table><tr><th>الطبيب</th><th>قيمة الأعمال</th><th>المدفوع</th><th>المتبقي</th></tr>${rows}</table></div>`}
if(page==='cashbox'){const inc=data.payments.reduce((s,p)=>s+Number(p.amount_iqd),0),out=data.expenses.reduce((s,e)=>s+Number(e.amount_iqd),0);c.innerHTML=`<div class="toolbar"><h3>الصندوق والمصروفات</h3><div class="actions"><button id="addPayment">+ دفعة</button><button id="addExpense" class="secondary">+ مصروف</button></div></div><div class="stats"><div class="stat"><span>المقبوضات</span><strong>${money(inc)}</strong></div><div class="stat"><span>المصروفات</span><strong>${money(out)}</strong></div><div class="stat"><span>الصافي</span><strong>${money(inc-out)}</strong></div></div><div class="panel"><h3>المصروفات</h3><table><tr><th>التاريخ</th><th>البيان</th><th>التصنيف</th><th>المبلغ</th></tr>${data.expenses.map(e=>`<tr><td>${e.expense_date}</td><td>${esc(e.title)}</td><td>${esc(e.category||'—')}</td><td>${money(e.amount_iqd)}</td></tr>`).join('')}</table></div>`}
if(page==='inventory')c.innerHTML=`<div class="toolbar"><h3>المخزون</h3><button id="addStock">+ إضافة مادة</button></div><div class="panel"><table><tr><th>المادة</th><th>الكمية</th><th>الوحدة</th><th>حد التنبيه</th></tr>${data.inventory.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.quantity}</td><td>${esc(x.unit)}</td><td>${x.reorder_level}</td></tr>`).join('')}</table></div>`;
if(page==='reports'){const sales=data.orders.reduce((s,o)=>s+orderTotal(o),0),income=data.payments.reduce((s,p)=>s+Number(p.amount_iqd),0),cost=data.teeth.reduce((s,t)=>s+Number(t.milling_cost_iqd)+Number(t.design_cost_iqd)+Number(t.buildup_cost_iqd)+Number(t.glaze_cost_iqd),0),expenses=data.expenses.reduce((s,e)=>s+Number(e.amount_iqd),0);c.innerHTML=`<div class="stats"><div class="stat"><span>قيمة الأعمال بعد الخصم</span><strong>${money(sales)}</strong></div><div class="stat"><span>المقبوضات</span><strong>${money(income)}</strong></div><div class="stat"><span>تكاليف الأسنان</span><strong>${money(cost)}</strong></div><div class="stat"><span>المصروفات</span><strong>${money(expenses)}</strong></div></div><div class="panel">الأرقام محسوبة من السجلات الحالية في قاعدة البيانات.</div>`}
}
function ordersTable(rows){if(!rows.length)return 'لا توجد طلبات مسجلة.';return `<table><tr><th>رقم</th><th>الطبيب</th><th>المريض</th><th>العمل</th><th>الأسنان</th><th>الحالة</th><th>القيمة</th><th></th></tr>${rows.map(o=>`<tr><td>#${o.order_number}</td><td>${esc(doctorName(o.doctor_id))}</td><td>${esc(o.patient_name)}</td><td>${esc(o.work_type)}</td><td>${data.teeth.filter(t=>t.order_id===o.id).map(t=>esc(t.tooth_number)).join('، ')||esc(o.teeth||'—')}</td><td><span class="pill">${esc(o.status)}</span></td><td>${money(orderTotal(o))}</td><td><button class="secondary" data-detail="${o.id}">التفاصيل</button></td></tr>`).join('')}</table>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field(label,name,type='text',required=true){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${required?'required':''}></div>`}
function doctorForm(){modal('إضافة طبيب',`<form id="doctorForm" class="formgrid">${field('اسم الطبيب','name')}${field('رقم الهاتف','phone','tel',false)}${field('العيادة','clinic','text',false)}<div class="field"><label>ملاحظات</label><textarea name="notes"></textarea></div><div><button>حفظ الطبيب</button></div></form>`);$('#doctorForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.created_by=user.id;const {error}=await db.from('doctors').insert(d);if(error)return msg(error.message,true);close();await refresh();render()}}
function orderForm(){if(!data.doctors.length)return msg('أضف طبيباً أولاً.',true);modal('تسجيل حالة جديدة',`<form id="orderForm"><div class="formgrid"><div class="field"><label>الطبيب</label><select name="doctor_id" required>${data.doctors.filter(d=>d.active!==false).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div>${field('اسم المريض','patient_name') }<div class="field"><label>نوع العمل</label><select name="work_type"><option>Zirconia Full Anatomy</option><option>Zirconia Layering</option><option>E.max</option><option>Implant</option><option>Removable</option><option>I-Bar Titanium</option></select></div><div class="field"><label>حالة الطلب</label><select name="status"><option>جديد</option><option>قيد العمل</option><option>مكتمل</option><option>تم التسليم</option><option>ملغي</option></select></div>${field('الأسنان (اختياري)','teeth','text',false)}${field('اللون Shade','shade','text',false)}${field('قسم الحالات','case_department','text',false)}${field('موعد التسليم','due_at','date',false)}${field('من أخذ السكانر؟','scanner_by','text',false)}${field('السعر الإجمالي بالدينار','price_iqd','number')}</div><hr><h4>تفاصيل الأسنان وتكلفة كل سن</h4><div id="teethRows"><div class="tooth"><input name="tooth_number_0" placeholder="رقم السن" required><input name="milling_0" type="number" placeholder="Milling" min="0" value="0"><input name="design_0" type="number" placeholder="Design" min="0" value="0"><input name="buildup_0" type="number" placeholder="Buildup" min="0" value="0"><input name="glaze_0" type="number" placeholder="Glaze" min="0" value="0"></div></div><button type="button" class="secondary" id="moreTooth">+ إضافة سن</button><div style="margin-top:16px"><button>حفظ الحالة</button></div></form>`);let ti=1;$('#moreTooth').onclick=()=>$('#teethRows').insertAdjacentHTML('beforeend',`<div class="tooth"><input name="tooth_number_${ti}" placeholder="رقم السن" required><input name="milling_${ti}" type="number" placeholder="Milling" min="0" value="0"><input name="design_${ti}" type="number" placeholder="Design" min="0" value="0"><input name="buildup_${ti}" type="number" placeholder="Buildup" min="0" value="0"><input name="glaze_${ti}" type="number" placeholder="Glaze" min="0" value="0"></div>`),ti++;
$('#orderForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),v=Object.fromEntries(fd);const order={doctor_id:v.doctor_id,patient_name:v.patient_name,work_type:v.work_type,status:v.status,teeth:v.teeth||null,shade:v.shade||null,case_department:v.case_department||null,scanner_by:v.scanner_by||null,due_at:v.due_at||null,created_by:user.id};const ins=await db.from('lab_orders').insert(order).select().single();if(ins.error)return msg(ins.error.message,true);const oid=ins.data.id;const fin=await db.from('order_financials').upsert({order_id:oid,price_iqd:Number(v.price_iqd||0),discount_iqd:0});if(fin.error)return msg('تم إنشاء الحالة لكن تعذّر حفظ قيمتها: '+fin.error.message,true);const toothRows=[];for(let i=0;i<ti;i++){const n=v[`tooth_number_${i}`];if(n)toothRows.push({order_id:oid,tooth_number:n,milling_cost_iqd:Number(v[`milling_${i}`]||0),design_cost_iqd:Number(v[`design_${i}`]||0),buildup_cost_iqd:Number(v[`buildup_${i}`]||0),glaze_cost_iqd:Number(v[`glaze_${i}`]||0),scanner_taken_by:v.scanner_by||null})}if(toothRows.length){const tr=await db.from('lab_order_teeth').insert(toothRows);if(tr.error)return msg('تم إنشاء الحالة لكن تعذّر حفظ الأسنان: '+tr.error.message,true)}close();await refresh();render()}}

function expenseForm(){modal('تسجيل مصروف',`<form id="expenseForm" class="formgrid">${field('البيان','title')}${field('التصنيف','category','text',false)}${field('المبلغ بالدينار','amount_iqd','number')}${field('التاريخ','expense_date','date')}<div class="field"><label>ملاحظات</label><textarea name="notes"></textarea></div><div><button>حفظ المصروف</button></div></form>`);$('#expenseForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.amount_iqd=Number(d.amount_iqd);d.created_by=user.id;const {error}=await db.from('expenses').insert(d);if(error)return msg(error.message,true);close();await refresh();render()}}
function stockForm(){modal('إضافة مادة',`<form id="stockForm" class="formgrid">${field('اسم المادة','name')}${field('الكمية','quantity','number')}${field('الوحدة','unit')}${field('حد التنبيه','reorder_level','number')}<div class="field"><label>ملاحظات</label><textarea name="notes"></textarea></div><div><button>حفظ المادة</button></div></form>`);$('#stockForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.quantity=Number(d.quantity);d.reorder_level=Number(d.reorder_level);const {error}=await db.from('inventory_items').insert(d);if(error)return msg(error.message,true);close();await refresh();render()}}
$('#rememberMe').checked=rememberPref;$('#loginForm').onsubmit=async e=>{e.preventDefault();rememberPref=$('#rememberMe').checked;localStorage.setItem(rememberKey,String(rememberPref));db=makeDb(rememberPref);$('#loginBtn').disabled=true;$('#loginMsg').textContent='جارٍ التحقق...';const {data,error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginBtn').disabled=false;if(error){$('#loginMsg').textContent='تعذّر الدخول: تحقق من البريد وكلمة المرور.';return}user=data.user;await enter()};$('#logout').onclick=async()=>{await db.auth.signOut();user=null;showLogin()};$('#refresh').onclick=async()=>{try{await refresh();render();msg('تم تحديث البيانات')}catch(e){msg(e.message,true)}};$('#close').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};$('#content').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='addDoctor')doctorForm();if(b.id==='addOrder')orderForm();if(b.id==='addPayment')paymentForm();if(b.id==='addExpense')expenseForm();if(b.id==='addStock')stockForm();if(b.dataset.toggleDoctor){const active=b.dataset.active==='true';const {error}=await db.from('doctors').update({active:!active}).eq('id',b.dataset.toggleDoctor);if(error)return msg(error.message,true);await refresh();render();msg(active?'تم تعطيل الطبيب':'تمت إعادة تفعيل الطبيب')}if(b.dataset.deleteDoctor){const id=b.dataset.deleteDoctor;if(!confirm('تأكيد الحذف النهائي؟ إذا كانت للطبيب طلبات أو مرضى أو دفعات مرتبطة سيمنع النظام الحذف وتبقى بياناته محفوظة.'))return;const {error}=await db.rpc('ava_delete_doctor',{p_doctor_id:id});if(error)return msg(error.message,true);await refresh();render();msg('تم حذف الطبيب')}if(b.dataset.detail){const o=data.orders.find(x=>x.id===b.dataset.detail),ts=data.teeth.filter(x=>x.order_id===o.id);modal('تفاصيل الحالة #'+o.order_number,`<p>الطبيب: ${esc(doctorName(o.doctor_id))} · المريض: ${esc(o.patient_name)}</p><p>قسم الحالات: ${esc(o.case_department||'—')} · السكانر: ${esc(o.scanner_by||'—')}</p><table><tr><th>السن</th><th>Milling</th><th>Design</th><th>Buildup</th><th>Glaze</th></tr>${ts.map(t=>`<tr><td>${esc(t.tooth_number)}</td><td>${money(t.milling_cost_iqd)}</td><td>${money(t.design_cost_iqd)}</td><td>${money(t.buildup_cost_iqd)}</td><td>${money(t.glaze_cost_iqd)}</td></tr>`).join('')}</table>`)} };$('#content').onchange=e=>{if(e.target.id==='doctorFilter'){const rows=data.orders.filter(o=>!e.target.value||o.doctor_id===e.target.value);$('#orderList').innerHTML=ordersTable(rows)}};
checkSession().catch(e=>{showLogin();$('#loginMsg').textContent='تعذر الاتصال بقاعدة البيانات. '+e.message});
</script></body></html>
